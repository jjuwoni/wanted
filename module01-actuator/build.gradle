plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.wanted'
version = '0.0.1-SNAPSHOT'
description = 'popular-shop-stage1-starter'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    /* Actuator 의존성
    *   액츄에이터는 어플리케이션 전반에 대한 운영 EndPoint 를 제공해준다.
    *   ex) CPU, JVM, Thread, ConnectionPool 등등
    *   Micrometer 라는 메트릭도 제공을 해주며, MeterRegistry 에 커스텀 메트릭도
    *   등록할 수 있게 된다.
    * */
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    /* Prometheus 의존성
    *   Application 에서 발생하는 Metric 들을 Prometheus 형식에 맞게 변환해주는 구현체.
    *   Prometheus 는 어플리케이션에서 발생한 Metric 을 수집하는 데이터베이스 라고 생각하면 된다.
    * */
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
