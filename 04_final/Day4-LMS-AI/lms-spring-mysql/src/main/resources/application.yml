# =====================================================================
# LMS Spring 설정 — MySQL 버전 (Day 4 최종)
# 사전 준비: db/init.sql 을 root로 1번 실행 (README의 STEP 1)
# =====================================================================
spring:
  datasource:
    # serverTimezone: 날짜 계산(과제 마감일)이 KST 기준으로 일관되게
    # characterEncoding: 한글 강좌명/이름 깨짐 방지
    url: jdbc:mysql://localhost:3306/lmsdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: lms_user
    password: lms1234!        # init.sql과 동일. 본인 환경이 다르면 여기만 수정

  jpa:
    hibernate:
      # none: 테이블 생성은 schema.sql이 담당 (엔티티 자동생성 X)
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      # ★ always: 서버를 켤 때마다 schema.sql(전체 재생성) → data.sql 실행.
      #   H2 시절의 "망가뜨려도 재시작하면 원상복구"를 MySQL에서 재현한 것.
      #   [실무 노트] 운영 DB에서 이 설정은 금물이다! 재시작 = 데이터 전멸.
      #   실무는 mode: never + Flyway/Liquibase 같은 마이그레이션 도구로
      #   스키마 '변경 이력'을 버전 관리한다. (README 실무 노트 참고)
      mode: always

  jackson:
    # API 계약서 2장: JSON 필드는 snake_case로 통일 (FastAPI와 맞춤)
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

# FastAPI AI 서버 주소 — RestClientConfig에서 사용
ai:
  server:
    base-url: http://localhost:8000
