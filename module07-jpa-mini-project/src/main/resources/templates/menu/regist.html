<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>신규 메뉴 등록</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(180deg, #140000 0%, #2b0808 45%, #4a1414 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff4e8;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 20px;
            padding: 42px 34px;
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(35, 0, 0, 0.95), rgba(75, 10, 10, 0.96));
            border: 2px solid rgba(255, 120, 60, 0.35);
            box-shadow:
                    0 0 25px rgba(255, 70, 0, 0.18),
                    0 0 60px rgba(120, 0, 0, 0.35),
                    0 18px 40px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0 0 12px;
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            color: #ffb347;
            text-shadow:
                    0 0 8px rgba(255, 120, 0, 0.55),
                    0 0 18px rgba(255, 60, 0, 0.35);
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #ffd7b3;
            font-size: 0.96rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 28px 24px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 0 1px rgba(255, 180, 120, 0.14);
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.98rem;
            font-weight: 700;
            color: #ffe2c2;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255, 160, 100, 0.35);
            border-radius: 14px;
            background: rgba(255, 248, 240, 0.96);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: #ff8c42;
            box-shadow: 0 0 12px rgba(255, 120, 60, 0.28);
        }

        input[type="submit"] {
            margin-top: 6px;
            border: none;
            border-radius: 16px;
            padding: 15px 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 800;
            color: #fff8f0;
            background: linear-gradient(135deg, #7a0c0c, #c62828 55%, #ff6f00);
            box-shadow:
                    0 8px 18px rgba(0, 0, 0, 0.28),
                    inset 0 1px 0 rgba(255, 220, 180, 0.18);
            transition: all 0.22s ease;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow:
                    0 12px 24px rgba(0, 0, 0, 0.35),
                    0 0 16px rgba(255, 90, 0, 0.35);
            background: linear-gradient(135deg, #921111, #e53935 55%, #ff8f00);
        }

        .guide {
            margin-top: 18px;
            text-align: center;
            color: #ffcfaa;
            font-size: 0.92rem;
            opacity: 0.95;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.6rem;
            }

            form {
                padding: 22px 18px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>😈 신규 메뉴 등록 😈</h1>
    <div class="subtitle">지옥의 주방에 새 메뉴를 추가해보자 🔥</div>

    <form action="/menu/regist" method="post">
        <div class="form-row">
            <label>메뉴 이름 :</label>
            <input type="text" name="menuName" placeholder="메뉴 이름을 입력하세요">
        </div>

        <div class="form-row">
            <label>메뉴 가격 :</label>
            <input type="number" name="menuPrice" placeholder="메뉴 가격을 입력하세요">
        </div>

        <div class="form-row">
            <label>카테고리 :</label>
            <select name="categoryCode" id="categoryCode"></select>
        </div>

        <div class="form-row">
            <label>판매여부 :</label>
            <select name="orderableStatus">
                <option value="Y">가능</option>
                <option value="N">불가능</option>
            </select>
        </div>

        <input type="submit" value="등록하기">
    </form>

    <div class="guide">🔥 새로운 메뉴를 장부에 올리고 손님을 유혹해봐 🔥</div>
</div>

<script>
    fetch('/menu/category')
        .then(res => res.json())
        .then(data => {
            const $categoryCode = document.getElementById("categoryCode");

            for (let index in data) {
                const $option = document.createElement("option");
                $option.value = data[index].categoryCode;
                $option.textContent = data[index].categoryName;

                $categoryCode.appendChild($option);
            }
        })
</script>
</body>
</html>
