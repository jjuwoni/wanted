<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>메뉴 상세 조회</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(180deg, #140000 0%, #2b0808 45%, #4a1414 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff4e8;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 20px;
            padding: 40px;
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(35, 0, 0, 0.95), rgba(75, 10, 10, 0.96));
            border: 2px solid rgba(255, 120, 60, 0.35);
            box-shadow:
                    0 0 25px rgba(255, 70, 0, 0.18),
                    0 0 60px rgba(120, 0, 0, 0.35),
                    0 18px 40px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0 0 30px;
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            color: #ffb347;
            text-shadow:
                    0 0 8px rgba(255, 120, 0, 0.55),
                    0 0 18px rgba(255, 60, 0, 0.35);
        }

        .subtitle {
            text-align: center;
            margin-bottom: 28px;
            color: #ffd7b3;
            font-size: 0.95rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 18px;
            background: rgba(255, 248, 240, 0.06);
            box-shadow: inset 0 0 0 1px rgba(255, 180, 120, 0.15);
        }

        th, td {
            padding: 18px 14px;
            text-align: center;
        }

        th {
            background: linear-gradient(135deg, #7a0c0c, #c62828, #ff6f00);
            color: #fffaf5;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        td {
            background: rgba(255, 255, 255, 0.04);
            color: #fff4e8;
            font-size: 0.98rem;
            border-top: 1px solid rgba(255, 180, 120, 0.14);
        }

        tr:hover td {
            background: rgba(255, 120, 60, 0.10);
            transition: 0.2s ease;
        }

        .empty-guide {
            margin-top: 18px;
            text-align: center;
            color: #ffcfaa;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px;
            }

            h1 {
                font-size: 1.5rem;
            }

            table, thead, tbody, tr, th, td {
                font-size: 0.9rem;
            }

            th, td {
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>😈 PathVariable 로 전달 받은 메뉴 상세 조회 😈</h1>
    <div class="subtitle">지옥의 셰프가 준비한 메뉴 정보를 확인해봐 🔥</div>

    <table>
        <tr>
            <th>메뉴번호</th>
            <th>메뉴이름</th>
            <th>메뉴가격</th>
            <th>카테고리코드</th>
            <th>판매상태</th>
        </tr>
        <tr>
            <td th:text="${result.menuCode}"></td>
            <td th:text="${result.menuName}"></td>
            <td th:text="${result.menuPrice}"></td>
            <td th:text="${result.categoryCode}"></td>
            <td th:text="${result.orderableStatus}"></td>
        </tr>
    </table>

    <div class="empty-guide">🔥 매콤한 메뉴 정보가 한눈에 보이도록 정리했어 🔥</div>
</div>

</body>
</html>
